<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Adal Notes</title>
<style>
  :root {
    --bg: #0b1220;
    --bg2: #101c33;
    --ac: #0ea5e9;
    --ac2: #0284c7;
    --tx: #f1f5f9;
    --mu: #94a3b8;
    --gl: rgba(255,255,255,.06);
    --bd: rgba(255,255,255,.12);
    --danger: #ef4444;
    --success: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: linear-gradient(135deg, var(--bg), var(--bg2)); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  .app { display: flex; flex-direction: row; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 300px; background: rgba(0,0,0,.4); backdrop-filter: blur(20px); border-right: 1px solid var(--bd); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; shrink: 0; }
  .logo { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, var(--ac), #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  
  /* User Box & Wallet */
  .user-box { background: var(--gl); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; }
  .user-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .user-sub { font-size: 12px; color: var(--mu); margin-bottom: 12px; }
  
  .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .wallet-card { background: rgba(0,0,0,.3); border: 1px solid var(--bd); border-radius: 8px; padding: 8px 10px; text-align: center; }
  .wallet-num { font-size: 18px; font-weight: 800; color: var(--ac); }
  .wallet-lbl { font-size: 10px; color: var(--mu); text-transform: uppercase; }

  /* Buttons & Inputs */
  .btn { padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; background: var(--gl); border: 1px solid var(--bd); color: #fff; cursor: pointer; transition: background .2s; text-align: center; width: 100%; display: block; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn-primary { background: linear-gradient(135deg, var(--ac), var(--ac2)); border: none; }
  .btn-success { background: var(--success); border: none; }

  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12px; color: var(--mu); margin-bottom: 6px; }
  .form-input { width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; outline: none; color: var(--tx); }
  textarea.form-input { resize: vertical; min-height: 120px; font-family: inherit; font-size: 13px; line-height: 1.4; }

  /* Main Workspace */
  .main { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  .workspace { background: var(--gl); border: 1px solid var(--bd); border-radius: 16px; padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

  /* Modals */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(8px); display: none; place-items: center; padding: 16px; z-index: 1000; }
  .modal-overlay.active { display: grid; }
  .modal { background: var(--bg2); border: 1px solid var(--bd); border-radius: 16px; padding: 24px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .qr-img { width: 100%; max-height: 200px; object-fit: contain; background: #fff; border-radius: 8px; padding: 8px; margin: 10px 0; }

  /* Toast Notifications */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ac); color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 500; z-index: 1000; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  /* Mobile Responsiveness */
  @media (max-width: 868px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--bd); padding: 16px; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>

<!-- Registration / Login Overlay -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <h2 style="font-size:20px;margin-bottom:6px">Welcome to Adal Notes</h2>
    <p style="font-size:13px;color:var(--mu);margin-bottom:16px">Enter your details to register or continue.</p>
    
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" id="authName" class="form-input" placeholder="e.g. John Doe" />
    </div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" id="authUsername" class="form-input" placeholder="e.g. johndoe" />
    </div>
    <button class="btn btn-primary" id="authSubmitBtn">Start Using Adal Notes</button>
  </div>
</div>

<!-- Top-Up Credits Modal -->
<div class="modal-overlay" id="topupModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:18px">Top-Up Credits</h3>
      <button onclick="closeTopupModal()" style="background:none;border:none;color:var(--mu);font-size:18px;cursor:pointer">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Select Credit Pack</label>
      <select id="topupPack" class="form-input" onchange="updateTopupDisplay()">
        <option value="doc_1">1 Document Credit — 20 Birr</option>
        <option value="doc_5">5 Document Credits — 80 Birr</option>
        <option value="img_5">5 Image Credits — 15 Birr</option>
        <option value="img_10">10 Image Credits — 25 Birr</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Select Payment Method</label>
      <select id="topupMethod" class="form-input" onchange="updateTopupDisplay()">
        <option value="telebirr">Telebirr</option>
        <option value="cbe">CBE Birr / Bank</option>
      </select>
    </div>

    <div id="qrContainer" style="text-align:center">
      <div id="qrPlaceholder" style="font-size:12px;color:var(--mu);padding:20px 0">Select payment method to view QR</div>
      <img id="qrDisplay" class="qr-img" style="display:none" />
    </div>

    <div class="form-group" style="margin-top:12px">
      <label class="form-label">Upload Payment Screenshot</label>
      <input type="file" accept="image/*" id="topupScreenshot" class="form-input" />
    </div>

    <button class="btn btn-success" id="submitPaymentBtn">Submit Payment Proof</button>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div>
      <div class="logo" style="margin-bottom:16px">Adal Notes</div>
      <div class="user-box">
        <div class="user-name" id="uDisplayName">Guest User</div>
        <div class="user-sub" id="uDisplayUsername">@guest</div>
        
        <div class="wallet-grid">
          <div class="wallet-card">
            <div class="wallet-num" id="uDocCredits">0</div>
            <div class="wallet-lbl">Docs</div>
          </div>
          <div class="wallet-card">
            <div class="wallet-num" id="uImgCredits">0</div>
            <div class="wallet-lbl">Images</div>
          </div>
        </div>

        <button class="btn btn-primary" onclick="openTopupModal()">+ Buy Credits</button>
      </div>
    </div>

    <div style="font-size:11px;color:var(--mu);text-align:center">
      Adal Notes v2.0 • Powered by Grok AI
    </div>
  </aside>

  <main class="main">
    <div class="workspace">
      <h2 style="font-size:18px">AI Assistant Workspace</h2>

      <div class="form-group">
        <label class="form-label">Processing Mode</label>
        <select id="procMode" class="form-input">
          <option value="doc">Document Processing (Uses 1 Doc Credit)</option>
          <option value="img">Image / OCR Extraction (Uses 1 Image Credit)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Upload File / Image</label>
        <input type="file" id="procFile" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">Additional Instructions / Query</label>
        <textarea id="procInput" class="form-input" placeholder="Enter instructions or leave blank to use global default prompt..."></textarea>
      </div>

      <button class="btn btn-primary" id="processBtn" style="padding:14px">⚡ Process with Grok AI</button>

      <div class="form-group" style="margin-top:10px;flex:1;display:flex;flex-direction:column">
        <label class="form-label">AI Output / Result</label>
        <textarea id="procOutput" class="form-input" readonly style="flex:1;min-height:200px;font-family:monospace;background:rgba(0,0,0,.5)" placeholder="Result will appear here..."></textarea>
      </div>
    </div>
  </main>
</div>

<script type="module">
const SB_URL = "https://hyedovbgfriqpavqpldh.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZWRvdmJnZnJpcXBhdnFwbGRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTM4MDQsImV4cCI6MjEwMzM2OTgwNH0.9cwyP8FFhxGK5xB90EZfxZO8LuMfXpTVzAwj0Q9cr28";

let sb = null;
let currentUser = null;
let currentWallet = { doc_credits: 0, img_credits: 0 };
let globalSettings = {};

async function boot() {
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  sb = createClient(SB_URL, SB_KEY);

  await loadGlobalSettings();
  checkAuth();
  bindEvents();
}

async function loadGlobalSettings() {
  const { data } = await sb.from('adal_settings').select('*');
  if (data) {
    data.forEach(item => {
      globalSettings[item.key] = item.value;
    });
  }
}

function checkAuth() {
  const savedUser = localStorage.getItem('adal_user');
  if (savedUser) {
    currentUser = JSON.parse(savedUser);
    syncUserSession();
  } else {
    document.getElementById('authModal').classList.add('active');
  }
}

async function syncUserSession() {
  if (!currentUser) return;

  // Update device active timestamp
  const nowIso = new Date().toISOString();
  await sb.from('adal_users').upsert({
    username: currentUser.username,
    name: currentUser.name,
    serial_number: currentUser.serial || 'DEVICE-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
    last_seen: nowIso
  });

  // Fetch current wallet
  const userKey = 'u_' + currentUser.username;
  const { data: wallet } = await sb.from('adal_wallets').select('*').eq('user_key', userKey).maybeSingle();

  if (wallet) {
    currentWallet = wallet;
  } else {
    currentWallet = { user_key: userKey, doc_credits: 1, img_credits: 5 }; // Starter bonus
    await sb.from('adal_wallets').insert(currentWallet);
  }

  updateUI();
}

function updateUI() {
  if (!currentUser) return;
  document.getElementById('uDisplayName').textContent = currentUser.name || currentUser.username;
  document.getElementById('uDisplayUsername').textContent = '@' + currentUser.username;
  document.getElementById('uDocCredits').textContent = currentWallet.doc_credits || 0;
  document.getElementById('uImgCredits').textContent = currentWallet.img_credits || 0;
}

window.openTopupModal = function() {
  document.getElementById('topupModal').classList.add('active');
  updateTopupDisplay();
};

window.closeTopupModal = function() {
  document.getElementById('topupModal').classList.remove('active');
};

window.updateTopupDisplay = function() {
  const method = document.getElementById('topupMethod').value;
  const qrImg = document.getElementById('qrDisplay');
  const placeholder = document.getElementById('qrPlaceholder');

  const qrData = method === 'telebirr' ? globalSettings['qr_telebirr'] : globalSettings['qr_cbe'];

  if (qrData) {
    qrImg.src = qrData;
    qrImg.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    qrImg.style.display = 'none';
    placeholder.style.display = 'block';
    placeholder.textContent = 'No QR image uploaded for this payment method.';
  }
};

function fileToBase64(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(file);
  });
}

function bindEvents() {
  // Authentication Submit
  document.getElementById('authSubmitBtn').onclick = async () => {
    const name = document.getElementById('authName').value.trim();
    const username = document.getElementById('authUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');

    if (!username) return toast('Please enter a valid username', 'error');

    currentUser = {
      name: name || username,
      username: username,
      serial: 'SN-' + Math.random().toString(36).substring(2, 10).toUpperCase()
    };

    localStorage.setItem('adal_user', JSON.stringify(currentUser));
    document.getElementById('authModal').classList.remove('active');
    await syncUserSession();
    toast('Welcome to Adal Notes!', 'success');
  };

  // Payment Proof Submit
  document.getElementById('submitPaymentBtn').onclick = async () => {
    if (!currentUser) return;
    const packVal = document.getElementById('topupPack').value;
    const method = document.getElementById('topupMethod').value;
    const file = document.getElementById('topupScreenshot').files[0];

    const [packType, creditsStr] = packVal.split('_');
    const credits = parseInt(creditsStr, 10);
    const amount = packVal === 'doc_1' ? 20 : packVal === 'doc_5' ? 80 : packVal === 'img_5' ? 15 : 25;

    let screenshotBase64 = '';
    if (file) screenshotBase64 = await fileToBase64(file);

    const { error } = await sb.from('adal_payments').insert({
      user_key: 'u_' + currentUser.username,
      pack: packType,
      credits: credits,
      amount: amount,
      method: method,
      screenshot: screenshotBase64,
      status: 'pending'
    });

    if (error) {
      toast('Failed to submit payment: ' + error.message, 'error');
    } else {
      toast('Payment proof submitted! Pending admin approval.', 'success');
      closeTopupModal();
    }
  };

  // AI Processing Action
  document.getElementById('processBtn').onclick = async () => {
    const mode = document.getElementById('procMode').value;
    const userPrompt = document.getElementById('procInput').value;
    const file = document.getElementById('procFile').files[0];

    // Credit validation
    if (mode === 'doc' && (currentWallet.doc_credits || 0) < 1) {
      return toast('Insufficient Document Credits. Please top up.', 'error');
    }
    if (mode === 'img' && (currentWallet.img_credits || 0) < 1) {
      return toast('Insufficient Image Credits. Please top up.', 'error');
    }

    const apiKey = globalSettings['grok_key'];
    if (!apiKey) {
      return toast('API Key missing. Contact admin.', 'error');
    }

    const defaultPrompt = mode === 'doc' ? (globalSettings['doc_prompt'] || '') : (globalSettings['img_prompt'] || '');
    const finalPrompt = (defaultPrompt + "\n\n" + userPrompt).trim();

    document.getElementById('procOutput').value = "Processing request with Grok AI...";

    try {
      let payload = {
        model: "grok-vision-beta",
        messages: []
      };

      if (file) {
        const fileData = await fileToBase64(file);
        payload.messages.push({
          role: "user",
          content: [
            { type: "text", text: finalPrompt || "Analyze this file/image." },
            { type: "image_url", image_url: { url: fileData } }
          ]
        });
      } else {
        payload.messages.push({
          role: "user",
          content: finalPrompt || "Hello!"
        });
      }

      const res = await fetch("https://api.x.ai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.choices && data.choices[0]) {
        document.getElementById('procOutput').value = data.choices[0].message.content;

        // Deduct credit
        if (mode === 'doc') currentWallet.doc_credits -= 1;
        else currentWallet.img_credits -= 1;

        await sb.from('adal_wallets').upsert(currentWallet);
        updateUI();
        toast('Processing complete!', 'success');
      } else {
        document.getElementById('procOutput').value = "Error response from API: " + JSON.stringify(data);
      }
    } catch (err) {
      document.getElementById('procOutput').value = "Request failed: " + err.message;
      toast('Processing failed', 'error');
    }
  };
}

function toast(m, t) { const e = document.createElement('div'); e.className = 'toast ' + (t || ''); e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), 3000); }

boot();
</script>
</body>
</html>
