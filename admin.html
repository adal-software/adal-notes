<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Adal Notes — Admin Dashboard</title>
<style>
  :root {
    --bg: #0b1220;
    --bg2: #101c33;
    --ac: #0ea5e9;
    --ac2: #0284c7;
    --tx: #f1f5f9;
    --mu: #94a3b8;
    --gl: rgba(255,255,255,.06);
    --bd: rgba(255,255,255,.12);
    --danger: #ef4444;
    --success: #22c55e;
    --warn: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: linear-gradient(135deg, var(--bg), var(--bg2)); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  .app { display: flex; flex-direction: row; min-height: 100vh; }
  
  /* Sidebar */
  .sidebar { width: 320px; background: rgba(0,0,0,.4); backdrop-filter: blur(20px); border-right: 1px solid var(--bd); padding: 20px; display: flex; flex-direction: column; gap: 12px; shrink: 0; }
  .logo { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--ac), #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
  .sidebar-header { font-size: 12px; color: var(--mu); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .users-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: calc(100vh - 120px); }

  /* User Cards */
  .user-card { background: var(--gl); border: 1px solid var(--bd); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: all .2s ease; position: relative; }
  .user-card:hover, .user-card.active { border-color: var(--ac); background: rgba(255,255,255,.12); }
  .user-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .user-name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-status { width: 10px; height: 10px; border-radius: 50%; background: #4b5563; flex-shrink: 0; }
  .user-status.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .user-sub { font-size: 12px; color: var(--mu); }
  .badge-red { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; background: var(--danger); border-radius: 50%; border: 2px solid var(--bg); }

  /* Main Area */
  .main { flex: 1; padding: 24px; overflow-y: auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 22px; font-weight: 800; }

  /* Layout Components */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .card { background: var(--gl); border: 1px solid var(--bd); border-radius: 16px; padding: 20px; }
  .card h3 { font-size: 16px; margin-bottom: 16px; color: var(--mu); display: flex; align-items: center; justify-content: space-between; }

  /* Controls */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12px; color: var(--mu); margin-bottom: 6px; }
  .form-input { width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; outline: none; color: var(--tx); }
  textarea.form-input { resize: vertical; min-height: 100px; font-family: inherit; font-size: 13px; line-height: 1.4; }
  
  .credit-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-group { display: flex; gap: 6px; margin-top: 6px; }
  .btn { padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; background: var(--gl); border: 1px solid var(--bd); color: #fff; cursor: pointer; transition: background .2s; text-align: center; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn-primary { background: linear-gradient(135deg, var(--ac), var(--ac2)); border: none; }
  .btn-danger { background: var(--danger); border: none; }
  .btn-success { background: var(--success); border: none; }

  .payment-item { background: rgba(0,0,0,.3); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .payment-img-wrap { margin: 10px 0; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--bd); cursor: pointer; }
  .payment-img { width: 100%; height: auto; display: block; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ac); color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 500; z-index: 1000; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  /* Mobile Layout Breakdown */
  @media (max-width: 868px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--bd); padding: 16px; }
    .users-list { max-height: 180px; }
    .main { padding: 16px; }
    .header { flex-direction: column; align-items: stretch; gap: 12px; }
    .credit-controls { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo">Adal Admin</div>
    <button class="btn btn-primary" id="openSettingsBtn" style="margin-bottom:8px">⚙️ General Settings</button>
    <div class="sidebar-header">REGISTERED USERS</div>
    <div class="users-list" id="usersList"></div>
  </aside>

  <main class="main">
    <div class="header">
      <h1 id="selectedUserHeader">General Settings</h1>
    </div>

    <!-- General Settings -->
    <div class="card" id="globalSettingsCard" style="margin-bottom:24px">
      <h3>General System Configuration</h3>
      
      <div class="form-group">
        <label class="form-label">xAI Grok API Key</label>
        <input type="password" id="cfgGrokKey" class="form-input" placeholder="xai-..." />
      </div>

      <div class="form-group">
        <label class="form-label">Document AI System Prompt</label>
        <textarea id="cfgDocPrompt" class="form-input" placeholder="Enter system prompt for Document processing..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Image / OCR System Prompt</label>
        <textarea id="cfgImgPrompt" class="form-input" placeholder="Enter system prompt for Image extraction..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Telebirr Payment QR Code</label>
        <input type="file" accept="image/*" id="cfgQrTelebirr" class="form-input" />
        <div id="prevTelebirr" style="margin-top:6px;font-size:12px;color:var(--mu)"></div>
      </div>

      <div class="form-group">
        <label class="form-label">CBE Birr Payment QR Code</label>
        <input type="file" accept="image/*" id="cfgQrCbe" class="form-input" />
        <div id="prevCbe" style="margin-top:6px;font-size:12px;color:var(--mu)"></div>
      </div>

      <button class="btn btn-success" id="saveGlobalBtn" style="width:100%">Save Configuration to Database</button>
    </div>

    <!-- User Details Section -->
    <div class="grid" id="userDetailsGrid" style="display:none">
      <div class="card">
        <h3>User Details & Wallet</h3>
        <div style="margin-bottom:16px;font-size:14px;line-height:1.6">
          <div><b>Full Name:</b> <span id="uDetailName">-</span></div>
          <div><b>Username:</b> <span id="uDetailUsername">-</span></div>
          <div><b>Device Serial:</b> <span id="uDetailSerial" style="font-family:monospace;font-size:12px">-</span></div>
          <div><b>Last Active:</b> <span id="uDetailSeen">-</span></div>
        </div>

        <button class="btn btn-danger" style="width:100%;margin-bottom:16px" onclick="deleteCurrentUser()">🗑️ Delete User Profile</button>
        
        <hr style="border-color:var(--bd);margin:16px 0" />

        <div class="credit-controls">
          <div>
            <label class="form-label">Document Credits</label>
            <div style="font-size:20px;font-weight:800" id="uDocCredits">0</div>
            <div class="btn-group">
              <button class="btn" onclick="adjustCredits('doc', 1)">+1</button>
              <button class="btn" onclick="adjustCredits('doc', 5)">+5</button>
              <button class="btn" onclick="adjustCredits('doc', -1)">-1</button>
            </div>
          </div>
          <div>
            <label class="form-label">Image Credits</label>
            <div style="font-size:20px;font-weight:800" id="uImgCredits">0</div>
            <div class="btn-group">
              <button class="btn" onclick="adjustCredits('img', 5)">+5</button>
              <button class="btn" onclick="adjustCredits('img', 10)">+10</button>
              <button class="btn" onclick="adjustCredits('img', -5)">-5</button>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:16px" id="saveCreditsBtn">Save Wallet Credits</button>
      </div>

      <div class="card">
        <h3>Payment Receipts & Verification</h3>
        <div id="userPaymentsList"></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
const SB_URL = "https://hyedovbgfriqpavqpldh.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZWRvdmJnZnJpcXBhdnFwbGRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTM4MDQsImV4cCI6MjEwMzM2OTgwNH0.9cwyP8FFhxGK5xB90EZfxZO8LuMfXpTVzAwj0Q9cr28";

let sb = null;
let usersCache = [];
let pendingPaymentsCache = [];
let selectedUser = null;
let selectedWallet = null;
let currentTelebirrQr = '';
let currentCbeQr = '';

async function boot() {
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  sb = createClient(SB_URL, SB_KEY);
  
  bindEvents();
  loadGlobalSettings();
  
  refreshData();
  setInterval(refreshData, 5000);
}

async function refreshData() {
  const { data: users } = await sb.from('adal_users').select('*').order('last_seen', { ascending: false });
  const { data: payments } = await sb.from('adal_payments').select('*').order('created_at', { ascending: false });
  
  usersCache = users || [];
  pendingPaymentsCache = payments || [];
  
  renderUsersList();
  if (selectedUser) {
    loadSelectedUser(selectedUser.username);
  }
}

function renderUsersList() {
  const container = document.getElementById('usersList');
  const now = new Date().getTime();
  
  container.innerHTML = usersCache.map(u => {
    const isOnline = (now - new Date(u.last_seen).getTime()) < 60000;
    const userKey = 'u_' + u.username;
    const hasPending = pendingPaymentsCache.some(p => p.user_key === userKey && p.status === 'pending');
    const isSelected = selectedUser && selectedUser.username === u.username;
    
    return `
      <div class="user-card ${isSelected ? 'active' : ''}" onclick="selectUser('${u.username}')">
        ${hasPending ? '<div class="badge-red"></div>' : ''}
        <div class="user-card-head">
          <span class="user-name">${esc(u.name || u.username)}</span>
          <span class="user-status ${isOnline ? 'online' : ''}"></span>
        </div>
        <div class="user-sub">@${esc(u.username)} • ${isOnline ? 'Active now' : new Date(u.last_seen).toLocaleDateString()}</div>
      </div>
    `;
  }).join('');
}

window.selectUser = function(username) {
  const user = usersCache.find(u => u.username === username);
  if (!user) return;
  selectedUser = user;
  document.getElementById('globalSettingsCard').style.display = 'none';
  document.getElementById('userDetailsGrid').style.display = 'grid';
  document.getElementById('selectedUserHeader').textContent = user.name || user.username;
  renderUsersList();
  loadSelectedUser(username);
};

async function loadSelectedUser(username) {
  const userKey = 'u_' + username;
  document.getElementById('uDetailName').textContent = selectedUser.name || 'N/A';
  document.getElementById('uDetailUsername').textContent = selectedUser.username;
  document.getElementById('uDetailSerial').textContent = selectedUser.serial_number || 'N/A';
  document.getElementById('uDetailSeen').textContent = new Date(selectedUser.last_seen).toLocaleString();

  const { data: wallet } = await sb.from('adal_wallets').select('*').eq('user_key', userKey).maybeSingle();
  selectedWallet = wallet || { user_key: userKey, doc_credits: 0, img_credits: 0 };
  
  document.getElementById('uDocCredits').textContent = selectedWallet.doc_credits || 0;
  document.getElementById('uImgCredits').textContent = selectedWallet.img_credits || 0;

  const userPayments = pendingPaymentsCache.filter(p => p.user_key === userKey);
  const payContainer = document.getElementById('userPaymentsList');
  
  if (!userPayments.length) {
    payContainer.innerHTML = '<div style="color:var(--mu);text-align:center;padding:20px">No payment history</div>';
    return;
  }

  payContainer.innerHTML = userPayments.map(p => `
    <div class="payment-item">
      <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700">
        <span>${p.pack === 'doc' ? '📄 Docs' : '🖼️ Images'} (${p.credits})</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="color:${p.status === 'approved' ? 'var(--success)' : p.status === 'rejected' ? 'var(--danger)' : 'var(--warn)'}">${p.status.toUpperCase()}</span>
          <button class="btn btn-danger" style="padding:4px 8px;font-size:11px" onclick="deletePayment('${p.id}')">🗑️ Delete</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--mu);margin-top:2px">Amount: ${p.amount} Birr via ${p.method} • ${new Date(p.created_at).toLocaleString()}</div>
      ${p.screenshot ? `
        <div class="payment-img-wrap" onclick="openImage('${p.id}')">
          <img src="${p.screenshot}" id="img-${p.id}" class="payment-img" />
        </div>
      ` : ''}
      ${p.status === 'pending' ? `
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-success" style="flex:1" onclick="processPayment('${p.id}', '${p.pack}', ${p.credits}, 'approved')">Approve & Add Credits</button>
          <button class="btn btn-danger" onclick="processPayment('${p.id}', '${p.pack}', ${p.credits}, 'rejected')">Reject</button>
        </div>
      ` : ''}
    </div>
  `).join('');
}

window.deleteCurrentUser = async function() {
  if (!selectedUser) return;
  if (!confirm(`Are you sure you want to delete @${selectedUser.username}?`)) return;

  const userKey = 'u_' + selectedUser.username;

  await sb.from('adal_users').delete().eq('username', selectedUser.username);
  await sb.from('adal_wallets').delete().eq('user_key', userKey);
  await sb.from('adal_payments').delete().eq('user_key', userKey);

  toast('User deleted successfully', 'success');
  selectedUser = null;
  document.getElementById('userDetailsGrid').style.display = 'none';
  document.getElementById('globalSettingsCard').style.display = 'block';
  document.getElementById('selectedUserHeader').textContent = 'General Settings';
  refreshData();
};

window.openImage = function(id) {
  const imgEl = document.getElementById('img-' + id);
  if (!imgEl) return;
  const w = window.open("");
  w.document.write(`<body style="margin:0;background:#000;display:grid;place-items:center;min-height:100vh"><img src="${imgEl.src}" style="max-width:100%;max-height:100vh" /></body>`);
};

window.deletePayment = async function(payId) {
  if (!confirm('Delete this payment log?')) return;
  const { error } = await sb.from('adal_payments').delete().eq('id', payId);
  if (error) toast('Delete failed: ' + error.message, 'error');
  else {
    toast('Payment log deleted', 'success');
    refreshData();
  }
};

window.adjustCredits = function(type, amount) {
  if (!selectedWallet) return;
  if (type === 'doc') {
    selectedWallet.doc_credits = Math.max(0, (selectedWallet.doc_credits || 0) + amount);
    document.getElementById('uDocCredits').textContent = selectedWallet.doc_credits;
  } else {
    selectedWallet.img_credits = Math.max(0, (selectedWallet.img_credits || 0) + amount);
    document.getElementById('uImgCredits').textContent = selectedWallet.img_credits;
  }
};

window.processPayment = async function(payId, pack, credits, status) {
  await sb.from('adal_payments').update({ status }).eq('id', payId);
  if (status === 'approved' && selectedWallet) {
    if (pack === 'doc') selectedWallet.doc_credits = (selectedWallet.doc_credits || 0) + credits;
    else selectedWallet.img_credits = (selectedWallet.img_credits || 0) + credits;
    await saveWallet();
  }
  toast(`Payment ${status}`, 'success');
  refreshData();
};

async function saveWallet() {
  if (!selectedWallet) return;
  const { error } = await sb.from('adal_wallets').upsert(selectedWallet);
  if (error) toast('Save failed: ' + error.message, 'error');
  else toast('Wallet updated ✓', 'success');
}

async function loadGlobalSettings() {
  const { data: keys } = await sb.from('adal_settings').select('*');
  if (!keys) return;
  keys.forEach(k => {
    if (k.key === 'grok_key') document.getElementById('cfgGrokKey').value = k.value || '';
    if (k.key === 'doc_prompt') document.getElementById('cfgDocPrompt').value = k.value || '';
    if (k.key === 'img_prompt') document.getElementById('cfgImgPrompt').value = k.value || '';
    if (k.key === 'qr_telebirr') { currentTelebirrQr = k.value; document.getElementById('prevTelebirr').textContent = k.value ? '✓ Image uploaded' : 'No image uploaded'; }
    if (k.key === 'qr_cbe') { currentCbeQr = k.value; document.getElementById('prevCbe').textContent = k.value ? '✓ Image uploaded' : 'No image uploaded'; }
  });
}

function fileToBase64(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(file);
  });
}

function bindEvents() {
  document.getElementById('openSettingsBtn').onclick = () => {
    selectedUser = null;
    document.getElementById('userDetailsGrid').style.display = 'none';
    document.getElementById('globalSettingsCard').style.display = 'block';
    document.getElementById('selectedUserHeader').textContent = 'General Settings';
    renderUsersList();
  };

  document.getElementById('saveCreditsBtn').onclick = saveWallet;

  document.getElementById('saveGlobalBtn').onclick = async () => {
    const k = document.getElementById('cfgGrokKey').value;
    const docPrompt = document.getElementById('cfgDocPrompt').value;
    const imgPrompt = document.getElementById('cfgImgPrompt').value;
    const tFile = document.getElementById('cfgQrTelebirr').files[0];
    const cFile = document.getElementById('cfgQrCbe').files[0];

    let tVal = currentTelebirrQr;
    let cVal = currentCbeQr;

    if (tFile) tVal = await fileToBase64(tFile);
    if (cFile) cVal = await fileToBase64(cFile);

    await sb.from('adal_settings').upsert([
      { key: 'grok_key', value: k },
      { key: 'doc_prompt', value: docPrompt },
      { key: 'img_prompt', value: imgPrompt },
      { key: 'qr_telebirr', value: tVal },
      { key: 'qr_cbe', value: cVal }
    ]);
    
    currentTelebirrQr = tVal;
    currentCbeQr = cVal;
    document.getElementById('prevTelebirr').textContent = tVal ? '✓ Image uploaded' : 'No image uploaded';
    document.getElementById('prevCbe').textContent = cVal ? '✓ Image uploaded' : 'No image uploaded';
    
    toast('Settings saved successfully', 'success');
  };
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function toast(m, t) { const e = document.createElement('div'); e.className = 'toast ' + (t || ''); e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), 3000); }

boot();
</script>
</body>
</html>
